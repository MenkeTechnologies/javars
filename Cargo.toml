[package]
name = "javars"
version = "0.1.5"
edition = "2021"
rust-version = "1.80"
description = "Java as a fusevm frontend: lexer, parser, and compiler to fusevm::Chunk, run on the shared three-tier Cranelift JIT — no bespoke VM or JVM"
license = "MIT"
documentation = "https://docs.rs/javars"
authors = ["MenkeTechnologies <linux.dev25.com>"]
repository = "https://github.com/MenkeTechnologies/javars"
homepage = "https://menketechnologies.github.io/javars/"
readme = "README.md"
keywords = ["java", "compiler", "jit", "fusevm", "bytecode"]
categories = ["command-line-utilities", "compilers"]
publish = true
# Dev-only artifacts kept out of the published crate. Consumers get src + the
# `java` bin — not CI config, the integration-test corpus, or the .java examples.
# None are referenced at compile time (no include_str! into them), so the
# packaged crate still builds and its bin runs.
exclude = [
    "/.github/",
    "/tests/",
    "/examples/",
    "/docs/",
    "/scripts/",
    "/BUGS.md",
]

# javars is a standalone crate, not a workspace member. An explicit empty
# `[workspace]` stops cargo walking up to the MenkeTechnologiesMeta parent.
[workspace]

[lib]
name = "javars"
path = "src/lib.rs"

[[bin]]
name = "java"
path = "src/main.rs"

# Offline generator for docs/reference.html — renders the keyword/type/IO
# reference (src/lsp.rs corpus) as a static page. Run before publishing Pages.
[[bin]]
name = "gen-docs"
path = "src/bin/gen_docs.rs"

[dependencies]
# Java executes on fusevm. javars is a pure frontend: it lexes/parses Java and
# lowers it to fusevm bytecode (src/compiler.rs). There is no local vm.rs/jit.rs
# and no JVM — execution and codegen live in the shared engine behind zshrs,
# stryke, awkrs, elisp, ruby.
#
# `jit-disk-cache` turns on fusevm's three-tier Cranelift JIT *and* its
# persistent on-disk cache of compiled native code (keyed by chunk hash), so hot
# Java loops trace-compile and warm runs skip recompilation. `aot` enables the
# ahead-of-time object emitter used by later `java --build` work.
#
# `ffi` enables fusevm's inline-Rust FFI bridge: a `rust { pub extern "C" fn … }`
# block compiles to a cdylib whose exports are callable by name from Java
# (src/rust_ffi.rs desugars the block; src/host.rs routes the `__rust_compile` /
# by-name-call dispatch into `fusevm::ffi`).
fusevm = { version = "0.26.0", features = ["jit", "jit-disk-cache", "aot", "ffi"] }

thiserror = "2.0"

# `String.split`/`replaceAll`/`replaceFirst`/`matches` take a
# `java.util.regex` pattern. Java's flavour is backtracking — it has
# backreferences (`\1`) and lookaround (`(?<=…)`), which the linear-time `regex`
# crate's automaton rejects outright — so the engine has to be `fancy-regex`,
# which layers a backtracking VM over `regex` for exactly those constructs.
# `src/regex.rs` translates the Java source into fancy-regex syntax and rejects
# the constructs whose meaning would not survive the translation.
fancy-regex = "0.18"

# LSP (`java --lsp`) + DAP (`java --dap`) over stdio. libc gives the DAP server a
# pipe + dup2 to capture the debuggee's stdout (System.out.print[ln]) so program
# output streams as `output` events instead of corrupting the JSON-RPC channel.
lsp-server = "0.7.9"
lsp-types = "0.97.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "parity-fuzz"
path = "src/bin/parity_fuzz.rs"
